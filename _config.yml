# --- Site settings ---
title: Following Curiosity
tagline: Where one question leads to the next
description: >-
  Following curiosity across books, ideas and projects… building a map of how
  history, geography, economics, technology, psychology, religion, education and
  AI connect.

author: Himabindu
email: hello@iamhimabindu.com

# Large-image Twitter/X card (jekyll-seo-tag). The default share image itself is
# set below via front-matter defaults, since seo-tag reads `image` per-page.
twitter:
  card: summary_large_image

# The public address of the site (your custom domain)
url: "https://iamhimabindu.com"
baseurl: ""

# --- Build settings ---
theme: minima
markdown: kramdown
permalink: /:year/:month/:day/:title/

# Pages to show in the top navigation
header_pages:
  - about.md

defaults:
  # Default social-share preview image for every page (jekyll-seo-tag og:image).
  # Any page can override by setting its own `image:` in front matter.
  - scope:
      path: ""
    values:
      image: /assets/images/about-hero.jpg
  # Default any post to the book series unless it sets its own `series:`
  - scope:
      path: ""
      type: posts
    values:
      series: "how-i-picked-my-next-book"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Don't copy these into the built site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - _notes
