# --- Site settings ---
title: Following Curiosity
tagline: Where one question leads to the next
description: >-
  Following curiosity across books, ideas and projects… building a map of how
  history, geography, economics, technology, psychology, religion, education and
  AI connect.

author: Himabindu
email: hello@iamhimabindu.com

# The public address of the site (your custom domain)
url: "https://iamhimabindu.com"
baseurl: ""

# --- Build settings ---
theme: minima
markdown: kramdown
permalink: /:year/:month/:day/:title/

# Pages to show in the top navigation
header_pages:
  - about.md

# Default any post to the book series unless it sets its own `series:`
defaults:
  - scope:
      path: ""
      type: posts
    values:
      series: "how-i-picked-my-next-book"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Don't copy these into the built site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - _notes
